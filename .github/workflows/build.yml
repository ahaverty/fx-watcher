name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.FX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fxwatcher.p12"
            echo "FX_KEYSTORE=$RUNNER_TEMP/fxwatcher.p12" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          FX_KEYSTORE_PASSWORD: ${{ secrets.FX_KEYSTORE_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk fx-watcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fx-watcher-apk
          path: fx-watcher.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" fx-watcher.apk --title "FX Watcher $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
