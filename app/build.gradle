plugins {
    id 'com.android.application'
}

android {
    namespace 'studio.alans.fxwatcher'
    compileSdk 34

    defaultConfig {
        applicationId 'studio.alans.fxwatcher'
        minSdk 29
        targetSdk 34
        versionCode 18
        versionName '3.2.0'
    }

    // Release builds are signed in CI from repository secrets (FX_KEYSTORE / FX_KEYSTORE_PASSWORD).
    // Without them (forks, local builds) they fall back to the debug key.
    def ks = System.getenv('FX_KEYSTORE')
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('FX_KEYSTORE_PASSWORD')
                keyAlias 'fxwatcher'
                keyPassword System.getenv('FX_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Sleep API for the optional Google sleep detection (bedtime media volume)
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    testImplementation 'junit:junit:4.13.2'
}
